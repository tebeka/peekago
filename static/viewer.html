<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peek-A-Go Viewer</title>
    <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="layout">
      <section class="hero viewer-hero">
        <p class="eyebrow">Peek-A-Go Viewer</p>
        <h1>Step through the trace.</h1>
        <p class="intro">The code is read-only here. Move through the recorded execution and inspect stack frames plus object relationships on the right.</p>
      </section>

      <section class="viewer-layout">
        <div class="panel code-stage">
          <div class="panel-header">
            <h2>Code</h2>
            <a class="text-link" href="/">Edit code</a>
          </div>

          <div class="timeline">
            <input id="step-range" type="range" min="0" max="0" value="0" disabled>
            <div id="step-label">No trace loaded</div>
          </div>

          <div class="current">
            <div>
              <span class="meta-label">File</span>
              <strong id="current-file">-</strong>
            </div>
            <div>
              <span class="meta-label">Line</span>
              <strong id="current-line">-</strong>
            </div>
            <div>
              <span class="meta-label">Function</span>
              <strong id="current-function">-</strong>
            </div>
          </div>

          <label class="sr-only" for="viewer-editor">Go source code</label>
          <textarea id="viewer-editor" spellcheck="false"></textarea>
        </div>

        <div class="panel vars-stage">
          <div class="panel-header">
            <h2>Frames and Objects</h2>
            <div class="controls">
              <button id="prev-button" type="button" disabled>Prev</button>
              <button id="next-button" type="button" disabled>Next</button>
            </div>
          </div>

          <div class="graph-stage">
            <div>
              <h3>Frames</h3>
              <div id="frames-view" class="stack-view empty">No frames</div>
            </div>
            <div>
              <h3>Objects</h3>
              <div id="objects-view" class="objects-view empty">No objects</div>
            </div>
          </div>
          <p id="viewer-status" class="status">Ready.</p>
        </div>
      </section>
    </main>

    <script src="/vendor/codemirror/lib/codemirror.js"></script>
    <script src="/vendor/codemirror/mode/go/go.js"></script>
    <script src="/viewer.js"></script>
  </body>
  </html>
