<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peek-A-Go</title>
    <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="layout">
      <section class="hero">
        <p class="eyebrow">Peek-A-Go</p>
        <h1>Write the Go program you want to inspect.</h1>
        <p class="intro">Paste a runnable <code>package main</code> program, run the tracer, and move to a dedicated viewer page for stepping through execution.</p>
      </section>

      <section class="compose-only">
        <form class="panel compose compose-single" method="post" action="/view">
          <div class="panel-header">
            <h2>Source</h2>
            <label class="sr-only" for="example-select">Load example</label>
            <select id="example-select">
              <option value="">Load example…</option>
              <option value="linked-list">Linked list</option>
              <option value="pointer-aliasing">Pointer aliasing</option>
              <option value="recursion">Recursion</option>
              <option value="stdout">Stdout</option>
              <option value="slice-mutation">Slice mutation</option>
              <option value="slice-view">Slice view</option>
              <option value="map-grow">Map grow</option>
            </select>
          </div>
          <label class="sr-only" for="editor-input">Go source code</label>
          <textarea id="editor-input" name="code" spellcheck="false">package main

import "fmt"

var total = 1

func add(n int) int {
	total += n
	return total
}

func main() {
	x := 2
	y := add(x)
	fmt.Println(y)
}</textarea>
          <p id="status" class="status">Ready.</p>
          <div class="compose-actions">
            <button id="run-button" class="primary-action" type="submit">
              <span class="button-label">Trace and Open Viewer</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="/vendor/codemirror/lib/codemirror.js"></script>
    <script src="/vendor/codemirror/mode/go/go.js"></script>
    <script src="/app.js"></script>
  </body>
  </html>
